<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a0533"/>
      <stop offset="100%" stop-color="#0c0118"/>
    </linearGradient>
  </defs>
  <!-- Background rounded square -->
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>
  <!-- Globe outline circle -->
  <circle cx="16" cy="16" r="9.5" stroke="url(#g)" stroke-width="1.8" fill="none"/>
  <!-- Horizontal equator line -->
  <line x1="6.5" y1="16" x2="25.5" y2="16" stroke="url(#g)" stroke-width="1.4"/>
  <!-- Vertical longitude ellipse -->
  <ellipse cx="16" cy="16" rx="4.5" ry="9.5" stroke="url(#g)" stroke-width="1.4" fill="none"/>
  <!-- Top arc (latitude) -->
  <path d="M9.5 11 Q16 8.5 22.5 11" stroke="url(#g)" stroke-width="1.2" fill="none"/>
  <!-- Bottom arc (latitude) -->
  <path d="M9.5 21 Q16 23.5 22.5 21" stroke="url(#g)" stroke-width="1.2" fill="none"/>
</svg>
